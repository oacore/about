# core.ac.uk/download/* -> chars-files (PDF download, 302 to pdf.core.ac.uk)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chars-files-coreac-download
  namespace: core-frontend
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway-system
  hostnames:
    - core.ac.uk
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /download
      backendRefs:
        - name: chars-files
          port: 80
