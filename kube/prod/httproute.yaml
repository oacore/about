apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: core-frontend-about
  namespace: core-frontend
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway-system
  hostnames:
    - core.ac.uk
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 30s
        backendRequest: 15s
      backendRefs:
        - name: core-frontend-about
          port: 80
---
# oai.core.ac.uk -> /oai_resolver page
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oai-resolver
  namespace: core-frontend
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway-system
  hostnames:
    - oai.core.ac.uk
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /oai_resolver
      backendRefs:
        - name: core-frontend-about
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: core-frontend-about
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oai-legacy-redirect
  namespace: core-frontend
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway-system
  hostnames:
    - oai.core.ac.uk
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: ^/oai:.*
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: core.ac.uk
            path:
              type: ReplaceFullPath
              replaceFullPath: /oai_resolver
            statusCode: 302
