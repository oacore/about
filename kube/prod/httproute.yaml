# apiVersion: gateway.networking.k8s.io/v1
# kind: HTTPRoute
# metadata:
#   name: core-frontend-about
#   namespace: core-frontend
# spec:
#   parentRefs:
#     - name: public-gateway
#       namespace: gateway-system
#   hostnames:
#     - core.ac.uk
#   rules:
#     - matches:
#         - path:
#             type: PathPrefix
#             value: /
#       timeouts:
#         request: 30s
#         backendRequest: 15s
#       backendRefs:
#         - name: core-frontend-about
#           port: 80


apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: core-frontend-about
  namespace: core-frontend
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway-system
  hostnames:
    - core.ac.uk
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /download
      timeouts:
        request: 30s
        backendRequest: 30s
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: fileserver-az.core.ac.uk
      backendRefs:
        - name: azure-func-backend
          port: 443
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 30s
        backendRequest: 15s
      backendRefs:
        - name: core-frontend-about
          port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: azure-func-backend
  namespace: core-frontend
spec:
  type: ExternalName
  externalName: fileserver-az.core.ac.uk
  ports:
    - port: 443
---
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: BackendTLSPolicy
metadata:
  name: azure-func-tls
  namespace: core-frontend
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: azure-func-backend
  validation:
    hostname: fileserver-az.core.ac.uk
    wellKnownCACertificates: System
---
# oai.core.ac.uk -> /oai_resolver page
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oai-resolver
  namespace: core-frontend
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway-system
  hostnames:
    - oai.core.ac.uk
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /oai_resolver
      backendRefs:
        - name: core-frontend-about
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: core-frontend-about
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oai-legacy-redirect
  namespace: core-frontend
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway-system
  hostnames:
    - oai.core.ac.uk
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: ^/oai:.*
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: core.ac.uk
            path:
              type: ReplaceFullPath
              replaceFullPath: /oai_resolver
            statusCode: 302
