meta:
  title: FreshFinds
  tagline: >
    Discovering new papers authored by your academics from around the world
    and depositing them into your repository.

headerLink:
  - link: How it works?
    href: '#how-it-works'
  - link: Workflow
    href: '#workflow'
  - link: How to apply?
    href: '#how-to-apply'

header:
  title: FreshFinds
  icon: /images/freshFinds.svg
  image: /images/freshFindsCount.png
  imageAlt: Universities linked to your repository, with counts of associated papers
  description: >
    Discovering new papers authored by your academics from around the world
    and depositing them into your repository.
  caption: >
    FreshFinds informs institutions of newly published papers authored by their
    academics which are missing in their repository. The key objective is to
    lower the barrier for repositories to deposit papers and keep a
    comprehensive record of the research outputs of their academics.
  actions:
    - caption: Become a member to get access
      variant: contained
      url: /membership

features:
  - title: Comprehensive coverage
    description: >
      Uncovers papers deposited in external subject repositories, archives,
      journals and institutional repositories around the world.
  - title: Significant efficiency gains
    description: >
      Save about 500h* of manual data input per year at a mid-size institution
      by adopting FreshFinds in your workflow.
  - title: Full-text manuscript ingest
    description: >
      Capable of delivering manuscript files alongside metadata records.
  - title: Zero infrastructure changes
    description: >
      Operates over established protocol standards (SWORD), requiring no
      changes to your current institutional repository architecture.

howItWorks:
  title: How it works?
  description: >
    CORE FreshFinds continuously monitors new research across bibliographic
    databases, preprint servers, and a global network of open repositories. It
    uses metadata matching and AI on full-text documents to identify
    institutional author affiliations, deduplicate entries against your
    existing holdings, and deliver direct deposits via SWORD.

workflow:
  title: FreshFinds workflow
  image: /images/freshfindsFlow.png
  imageAlt: FreshFinds workflow from data sources through matching, deduplication and deposit into your repository
  steps:
    - step: '1'
      title: Discovery
      description: >
        Continuous monitoring across Crossref, preprint servers, open access
        journals, and a global network of over 15,000 repositories.
    - step: '2'
      title: Smart matching
      description: >
        Combines standard identifiers (ROR IDs, ORCID, ISNI) with supervised
        machine-learning text extraction to identify author affiliations and
        institutional email domains directly from manuscript headers.
    - step: '3'
      title: Deduplication
      description: >
        Employs locality-sensitive hashing to cross-check articles against
        your current repository holdings, preventing duplicate entries.
    - step: '4'
      title: Dashboard review
      description: >
        A dashboard module for reviewing suggested articles and controlling
        repository imports.
    - step: '5'
      title: Flexible deposit
      description: >
        Delivers metadata and full-text files directly into your repository
        via SWORD integration or manual export formats.
    - step: '6'
      title: Notifications & automation
      description: >
        Easily configure your FreshFinds settings within your CORE Dashboard
        account to toggle auto-deposits, adjust sources and set alert
        frequencies that fit your team's schedule.

start:
  title: Start with FreshFinds
  caption: FreshFinds is available to CORE Sustaining Members.
  actions:
    - caption: Become a member
      variant: contained
      url: /membership
    - caption: Log in to the CORE Dashboard
      variant: outlined
      url: https://dashboard.core.ac.uk
      target: _blank

